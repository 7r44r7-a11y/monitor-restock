name: Monitor restock

on:
  schedule:
    - cron: "*/5 * * * *" # a cada 5 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: # permite correr à mão no separador Actions

permissions:
  contents: write # para guardar o estado.json no repositório

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # usa sempre o estado mais recente (mesmo num "Re-run")

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar stock
        run: node monitor.js --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Lisbon

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar estado"
            git pull --rebase origin main
            git push
          fi
